name: Build MnaLauncher APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build native APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/MnaLauncher-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MnaLauncher-debug
          path: artifacts/MnaLauncher-debug.apk
          if-no-files-found: error
