name: Build MnaLauncher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Установить компоненты Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Собрать APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Подготовить файл APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/MnaLauncher-debug.apk

      - name: Сохранить APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: MnaLauncher-debug
          path: artifacts/MnaLauncher-debug.apk
          if-no-files-found: error
